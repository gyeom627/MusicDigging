{% extends "base.html" %}
{% block title %}가입{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>가입</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>아이디 <small>영문 소문자·숫자·밑줄 4~20자</small>
      <input name="username" value="{{ form.username }}" required pattern="[a-z0-9_]{4,20}" autocomplete="username"></label>
    <label>닉네임 <small>2~12자, 게시판·랭킹에 표시</small>
      <input name="nickname" value="{{ form.nickname }}" required minlength="2" maxlength="12"></label>
    <label>비밀번호 <small>8자 이상</small>
      <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>비밀번호 확인
      <input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">가입하기</button>
  </form>
</section>
{% endblock %}
